name: Verify

# pull_request runs the workflow file from the merge commit. A fork can replace
# this file, so this workflow never uses a self-hosted runner. Node 24 is
# installed here because the maintainer job gets it from node:24-bookworm.
on:
  pull_request:
    branches: [master]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run the checks
        run: bash .github/scripts/verify.sh
