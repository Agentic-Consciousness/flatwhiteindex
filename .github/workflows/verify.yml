name: Verify

# pull_request runs the workflow file from the merge commit. A fork can replace
# this file, so this workflow never uses a self-hosted runner. Node 24 is
# installed here because the maintainer job gets it from node:24-bookworm.
on:
  pull_request:
    branches: [master]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run the checks
        run: bash .github/scripts/verify.sh

  # Frozen-lockfile install + production build. Not a required check;
  # making it required is a separate branch-protection decision for Daniel.
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: [personal-official]
    container:
      image: node:24-bookworm
      options: --init --cpus 2 --memory 6g
    timeout-minutes: 60
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # Safe CI fixtures only — no real secrets.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:9/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:9/ci
      NEXTAUTH_SECRET: ci-only-fixture-at-least-thirty-two-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Frozen install and build
        shell: bash
        run: |
          set -euo pipefail
          unset VERCEL_ENV VERCEL VERCEL_TOKEN || true
          npm ci
          npm run build
