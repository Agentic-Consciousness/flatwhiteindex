name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# checkout needs contents read. setup-node's npm cache needs actions write;
# every other token scope stays closed.
permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - run: npm ci
      - run: npm test
